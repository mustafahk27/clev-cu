[project]
name = "clev"
version = "0.1.0"
description = "Fast computer use agent: a small decision model picks UI actions, a frontier LLM plans and handles uncertain steps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.19.2",
    "playwright>=1.63.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
clev = "clev.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop (and one Chromium) shared by all browser tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: hits real sites or APIs; run with `-m live`"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]  # keep plan/doc code sketches as written

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
